services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - copy .env.example to .env first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audit -d audit']
      interval: 2s
      retries: 30

  # Migrations are a separate one-shot step; the API never migrates on start-up.
  # Release steps: apply migrations, then compile the content packs into the knowledge graph.
  migrate:
    image: audit-platform-backend:local
    build: ./backend
    command: ['sh', '-c', 'node dist/db/cli.js migrate && node dist/knowledge/packs-cli.js compile']
    environment:
      DATABASE_URL: postgres://audit:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - copy .env.example to .env first}@postgres:5432/audit
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: audit-platform-backend:local
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: '3002'
      DATABASE_URL: postgres://audit:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - copy .env.example to .env first}@postgres:5432/audit
      # Local demo defaults. A real deployment sets NODE_ENV=production, DEV_AUTH=false and the OIDC_* settings.
      NODE_ENV: ${NODE_ENV:-development}
      DEV_AUTH: ${DEV_AUTH:-true}
      # Demo only: the packs are unreviewed drafts (refused when NODE_ENV=production)
      ALLOW_UNVERIFIED_CITATIONS: ${ALLOW_UNVERIFIED_CITATIONS:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_ROLE_MAP: ${OIDC_ROLE_MAP:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      # offline (default, no key needed) | anthropic
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BLOB_DRIVER: s3
      S3_BUCKET: audit-evidence
      S3_ENDPOINT: http://objectstore:8333
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: ${S3_ROOT_ACCESS_KEY:?Set S3_ROOT_ACCESS_KEY in .env}
      S3_SECRET_ACCESS_KEY: ${S3_ROOT_SECRET_KEY:?Set S3_ROOT_SECRET_KEY in .env}
      BLOB_MAX_BYTES: ${BLOB_MAX_BYTES:-26214400}
      # SeaweedFS 3.80 ignores If-None-Match on PUT, so the API checks for an object before writing it.
      S3_CONDITIONAL_WRITES: 'false'
    # Bound to this machine only: demo sign-in (DEV_AUTH=true) must never be reachable by others.
    ports:
      - '127.0.0.1:3002:3002'
    depends_on:
      migrate:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - backend

  # Local OpenID provider for testing real sign-in: docker compose --profile sso up -d keycloak
  # Run the API on the host (npm run dev) so the browser and the API see the same issuer URL.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ['sso']
    command: ['start-dev', '--import-realm', '--http-port=8081']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Set KEYCLOAK_ADMIN_PASSWORD in .env before using the sso profile (compose evaluates this even when the profile is off)
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
    volumes:
      - ./deploy/keycloak/audit-realm.json:/opt/keycloak/data/import/audit-realm.json:ro
    ports:
      - '127.0.0.1:8081:8081'

  # S3-compatible object storage for evidence and documents (SeaweedFS locally; S3 or Azure Blob in production).
  # The S3 identity file is written at start-up from .env, so no credentials are committed.
  objectstore:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mkdir -p /etc/seaweedfs /data
        printf '{"identities":[{"name":"audit","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ROOT_ACCESS_KEY" "$$S3_ROOT_SECRET_KEY" > /etc/seaweedfs/s3.json
        # -dir=/data holds both the volumes and the filer's metadata (/data/filerldb2), so both persist in blobdata.
        exec weed server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    environment:
      S3_ROOT_ACCESS_KEY: ${S3_ROOT_ACCESS_KEY:?Set S3_ROOT_ACCESS_KEY in .env - copy .env.example to .env first}
      S3_ROOT_SECRET_KEY: ${S3_ROOT_SECRET_KEY:?Set S3_ROOT_SECRET_KEY in .env}
    volumes:
      - blobdata:/data
    ports:
      - '127.0.0.1:8333:8333'
    # Healthy = the S3 gateway answers: an anonymous request gets 200 or 403 (AccessDenied). Anything else (no answer, 5xx) is not ready.
    healthcheck:
      test: ['CMD-SHELL', 'wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -qE "HTTP/[0-9.]+ (200|403)"']
      interval: 2s
      retries: 60

  # One-shot: create the bucket the API stores files in.
  objectstore-init:
    image: amazon/aws-cli:2.22.35
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        last=""
        for i in $$(seq 1 60); do
          if last=$$(aws --endpoint-url http://objectstore:8333 s3api head-bucket --bucket audit-evidence 2>&1); then exit 0; fi
          if last=$$(aws --endpoint-url http://objectstore:8333 s3api create-bucket --bucket audit-evidence 2>&1); then exit 0; fi
          sleep 2
        done
        # aws-cli errors name the operation and the service's answer, never the keys.
        echo "could not create bucket audit-evidence; last error: $$last" >&2; exit 1
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ROOT_ACCESS_KEY:?Set S3_ROOT_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_SECRET_KEY:?Set S3_ROOT_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      objectstore:
        condition: service_healthy

volumes:
  pgdata:
  blobdata:
